<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premium Portfolio | Restu</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #ff7e5f;
            --secondary: #feb47b;
            --dark: #1a1a1a;
            --glass: rgba(255, 255, 255, 0.15);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; transition: 0.3s; }

        body {
            background: linear-gradient(135deg, #ff7e5f, #feb47b);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            padding: 40px 20px;
            overflow-x: hidden;
        }

        /* DARK MODE CLASS */
        body.dark-mode { background: #121212; }
        .dark-mode .container { background: rgba(0, 0, 0, 0.4); color: white; }

        .container {
            width: 100%;
            max-width: 600px;
            background: var(--glass);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 30px;
            padding: 40px;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0,0,0,0.15);
        }

/* FLOATING CONTROLS - Ditaruh paling depan agar tidak ketutup */
.controls { 
    position: fixed; 
    top: 20px; 
    right: 20px; 
    display: flex; 
    gap: 15px; 
    z-index: 9999; /* Angka tinggi supaya selalu di depan */
}

.circle-btn {
    width: 50px; 
    height: 50px; 
    border-radius: 50%; 
    border: none;
    background: white; 
    cursor: pointer; 
    display: flex; 
    align-items: center; 
    justify-content: center; 
    font-size: 22px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.2);
    transition: 0.3s;
}

.circle-btn:hover {
    transform: scale(1.1);
    background: #fff5f0;
}

/* Biar ikon di dalam tombol kelihatan jelas */
.circle-btn span {
    line-height: 1;
}


        /* PROFILE */
        .profile-img {
            width: 130px; height: 130px; border-radius: 50%; border: 5px solid white;
            object-fit: cover; margin-bottom: 20px;
        }

        h1 { font-weight: 700; margin-bottom: 5px; }
        .typing { color: #fff; font-weight: 400; font-size: 16px; min-height: 24px; }

        /* SKILLS SECTION */
        .skill-box { margin-top: 30px; text-align: left; }
        .skill-bar { height: 10px; background: rgba(255,255,255,0.3); border-radius: 10px; margin-bottom: 15px; position: relative; }
        .skill-per { height: 100%; background: white; border-radius: 10px; width: 0; animation: fillBar 2s forwards; }
        .skill-name { font-size: 13px; font-weight: 600; margin-bottom: 5px; display: block; }

        @keyframes fillBar { from { width: 0; } to { width: var(--w); } }

        /* IMAGE SECTION */
        .card-img { width: 100%; border-radius: 20px; margin: 20px 0; border: 3px solid white; }

        /* CONTACT LINKS */
        .links-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 20px; }
        .link-card {
            background: white; color: var(--primary); padding: 15px; border-radius: 15px;
            text-decoration: none; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 10px;
        }
        .link-card:hover { transform: translateY(-5px); background: #fff5f0; }

        /* MODAL */
        .modal {
            display: none; position: fixed; top:0; left:0; width:100%; height:100%;
            background: rgba(0,0,0,0.8); backdrop-filter: blur(10px); z-index: 100;
            justify-content: center; align-items: center;
        }
        .modal-content { background: white; padding: 40px; border-radius: 25px; text-align: center; color: #333; max-width: 300px; }

        button.main-btn {
            margin-top: 20px; padding: 12px 30px; border-radius: 25px; border: none;
            background: var(--primary); color: white; font-weight: 600; cursor: pointer;
        }
    </style>
</head>
<body>

<div class="controls">
    <button class="circle-btn" onclick="toggleDarkMode()">🌓</button>
    <button class="circle-btn" onclick="toggleMusic()">🎵</button>
</div>

<div class="container">
    <img src="aku.jpg" class="profile-img" alt="Restu">
    <h1>Restu Aristianto</h1>
    <div class="typing" id="typingText"></div>

    <div class="skill-box">
        <span class="skill-name">HTML & CSS</span>
        <div class="skill-bar"><div class="skill-per" style="--w: 90%;"></div></div>
        
        <span class="skill-name">Database</span>
        <div class="skill-bar"><div class="skill-per" style="--w: 85%;"></div></div>
        
        <span class="skill-name">Python & PHP</span>
        <div class="skill-bar"><div class="skill-per" style="--w: 75%;"></div></div>
    </div>

    <h2 style="margin-top: 30px; font-size: 18px;">Sertifikat Keahlian</h2>
    <img src="sertifikat.jpg" class="card-img" alt="Sertifikat">

    <div class="links-grid">
        <a href="https://wa.me/6281398098107" class="link-card">WhatsApp</a>
        <a href="mailto:restuaristianto@gmail.com" class="link-card">Gmail</a>
    </div>

    <div style="margin-top: 30px;">
        <p style="font-size: 14px; margin-bottom: 10px;">Beri masukan tentang web ini:</p>
        <input type="text" id="msg" placeholder="Ketik di sini..." style="width: 100%; padding: 12px; border-radius: 15px; border: none; margin-bottom: 10px; outline: none;">
        <button class="main-btn" style="background: white; color: var(--primary); width: 100%;" onclick="sendMsg()">Kirim Masukan</button>
    </div>
</div>

<div id="pop" class="modal">
    <div class="modal-content">
        <h2 style="color: var(--primary);">🚀 Terkirim!</h2>
        <p>Makasih ya bro udah mampir dan kasih masukan!</p>
        <button class="main-btn" onclick="document.getElementById('pop').style.display='none'">Sama-sama</button>
    </div>
</div>

<audio id="bgMusic" loop src="tante.mp3"></audio>

<script>
    // Fitur Auto Typing
    const text = "Web Developer | PPLG Graduate | Tech Enthusiast";
    let i = 0;
    function type() {
        if (i < text.length) {
            document.getElementById("typingText").innerHTML += text.charAt(i);
            i++;
            setTimeout(type, 100);
        }
    }
    type();

    // Fitur Dark Mode
    function toggleDarkMode() {
        document.body.classList.toggle("dark-mode");
    }

    // Fitur Music
    const music = document.getElementById("bgMusic");
    function toggleMusic() {
        return music.paused ? music.play() : music.pause();
    }

    // Fitur Kirim Pesan
    function sendMsg() {
        if(document.getElementById("msg").value == "") return alert("Isi dulu dong!");
        document.getElementById("pop").style.display = "flex";
        document.getElementById("msg").value = "";
    }
</script>

</body>
</html>
